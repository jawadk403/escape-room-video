name: fetch-media
on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS URL of the file to fetch
        required: true
      dest:
        description: Repo path to save it at (e.g. folder/file.mp4)
        required: true
      split_over_mb:
        description: Split into 7z volumes if larger than this many MB
        required: false
        default: "100"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p "$(dirname "${{ inputs.dest }}")"
          curl -fL --retry 3 -o "${{ inputs.dest }}" "${{ inputs.url }}"
          ls -la "$(dirname "${{ inputs.dest }}")"
      - name: Split if large
        run: |
          f="${{ inputs.dest }}"; lim=$(( ${{ inputs.split_over_mb }} * 1024 * 1024 ))
          sz=$(stat -c %s "$f")
          if [ "$sz" -gt "$lim" ]; then
            sudo apt-get -y -qq install p7zip-full >/dev/null
            7z a -mx=0 -v45m "${f%.*}.7z" "$f" >/dev/null && rm "$f"
          fi
      - name: Commit
        run: |
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add -A && git commit -m "Add ${{ inputs.dest }}" && git push
